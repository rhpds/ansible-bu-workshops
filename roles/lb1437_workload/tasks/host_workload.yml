---
- name: Install packages
  ansible.builtin.dnf:
    name:
      - java-17-openjdk
      - python3-pip
    state: present
  become: true

- name: Install python dependencies
  ansible.builtin.pip:
    executable: pip3
    state: present
    name:
      - ansible-rulebook
      - psycopg[binary]
      - aiokafka
      - paramiko
